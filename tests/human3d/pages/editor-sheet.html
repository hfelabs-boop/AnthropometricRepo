<!doctype html>
<meta charset="utf-8">
<title>posture cards sheet</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<!-- Visual harness for the stick figures on the cards of the Posture panel (panels/posture.js stickFigure / drawStick), without the shell and without WebGL:
     every library posture on one body, one cell each, with the validator badge the card would show. By hand or from Python:
       python3 tests/human3d/shot.py /__pages/editor-sheet.html out.png --wait-fn 'window.__sheet.ready' --w 1200 --h 1400
     Query: ?pop=united-states/army/M&pct=50 (population and percentile), &cat=Sitting (one category), &id=sit-upright-90 (one posture), &w=128 (cell size in px), &dark=1.
     window.__sheet: { ready, count, drawn, failed: [ids], cells: [{ id, ink }] } -- `ink` is the number of drawn pixels, 0 for a posture that could not be drawn. -->
<script type="importmap">{"imports":{"three":"/vendor/three/three.module.min.js","three/addons/":"/vendor/three/addons/"}}</script>
<style>
  :root { --bg: #ecebe6; --fg: #1d1d1b; --muted: #6a6963; --line: #c9c7bd; --card: #fbfaf7; --ok: #1a7f4b; --warn: #a86a00; --bad: #c0332b; --near: #44443f; --far: #9a998f; --spine: #1d1d1b; --floor: #bdbbb0; --seat: #1c5cab; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161615; --fg: #efeee9; --muted: #a09f96; --line: #3a3a36; --card: #1f1f1d; --ok: #46c487; --warn: #e0a03a; --bad: #ff7468; --near: #d8d7d0; --far: #77766e; --spine: #efeee9; --floor: #55554f; --seat: #6fa8f5; } }
  :root[data-theme="dark"] { --bg: #161615; --fg: #efeee9; --muted: #a09f96; --line: #3a3a36; --card: #1f1f1d; --ok: #46c487; --warn: #e0a03a; --bad: #ff7468; --near: #d8d7d0; --far: #77766e; --spine: #efeee9; --floor: #55554f; --seat: #6fa8f5; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 12px/1.3 system-ui, sans-serif; }
  #sheet { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--cell, 128px), 1fr)); gap: 8px; padding: 12px; }
  figure { margin: 0; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 6px; display: grid; gap: 4px; justify-items: center; }
  figcaption { text-align: center; overflow-wrap: anywhere; }
  figcaption small { display: block; color: var(--muted); }
  .ok { color: var(--ok); } .notes { color: var(--warn); } .fails { color: var(--bad); }
</style>
<div id="sheet" role="list" aria-label="Postures"></div>
<script type="module">
import { fitBody } from "/js/human/fit.js";
import { percentileProfile } from "/js/human/anthro.js";
import { POSTURES } from "/js/human/postures.js";
import { stickCached, drawStick, validateCached } from "/js/human/panels/posture.js";

const q = new URLSearchParams(location.search);
if (q.get("dark") === "1") document.documentElement.dataset.theme = "dark";
const cell = Number(q.get("w")) || 128;
document.getElementById("sheet").style.setProperty("--cell", `${cell}px`);
const pop = q.get("pop") || "united-states/army/M", pct = Number(q.get("pct")) || 50;
const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const palette = { near: css("--near"), far: css("--far"), spine: css("--spine"), floor: css("--floor"), seat: css("--seat") };

const data = await (await fetch(`/api/v1/populations/${pop}.json`)).json();
const body = fitBody(percentileProfile(data, { percentile: pct }));
const list = POSTURES.filter((p) => (!q.get("cat") || p.category === q.get("cat")) && (!q.get("id") || p.id === q.get("id")));
const out = { ready: false, count: list.length, drawn: 0, failed: [], cells: [] };
window.__sheet = out;
const dpr = Math.min(2, devicePixelRatio || 1);
for (const p of list) {
  const fig = document.createElement("figure"), cv = document.createElement("canvas"), cap = document.createElement("figcaption");
  fig.setAttribute("role", "listitem");
  cv.width = cv.height = Math.round(cell * dpr); cv.style.width = cv.style.height = `${cell}px`;
  const v = validateCached(body, p), badge = v.ok ? (v.warnings?.length ? "notes" : "ok") : "fails";
  cap.innerHTML = `${p.name.replace(/[<&]/g, " ")}<small class="${badge}">${p.id} · ${badge}</small>`;
  fig.append(cv, cap);
  document.getElementById("sheet").append(fig);
  const g = stickCached(body, p);
  let ink = 0;
  if (g) {
    const c2 = cv.getContext("2d");
    drawStick(c2, g, cv.width, cv.height, palette, body.stature ?? 1.75, dpr);
    const d = c2.getImageData(0, 0, cv.width, cv.height).data;
    for (let i = 3; i < d.length; i += 4) if (d[i] > 40) ink++;
    out.drawn++;
  } else out.failed.push(p.id);
  out.cells.push({ id: p.id, ink });
}
out.ready = true;
</script>
