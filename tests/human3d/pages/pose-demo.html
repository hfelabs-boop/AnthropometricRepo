<!doctype html>
<meta charset="utf-8">
<title>pose demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<!-- Look at a posture of pose.js / postures.js: the fitted body (rig, skeleton), the collision proxies of proxies.js as translucent capsules, the floor, the seat plane,
     the support polygon and the centre of mass. For the author of a posture and for the screenshots of the contact sheet.
     python3 tests/human3d/shot.py /__pages/pose-demo.html out.png --wait-fn 'window.__ready' --eval 'window.__demo.show({ id: "x", support: "seat+feet", joints: { hip_LR: [90,0,0], knee_LR: [90,0] } }, { az: 60 })'
     URL parameters: ?stature=1.75&sex=M|F, ?size=640. window.__demo: { body, rig, show(posture | { pose }, { az, el, dist, proxies, labels }) → the validatePosture result with the root, library(id, opts) }
     show() places the posture with pose.js (support, seat height, anchor 0,0), sets the rig and draws the overlays. -->
<script type="importmap">{"imports":{"three":"/vendor/three/three.module.min.js","three/addons/":"/vendor/three/addons/"}}</script>
<style>
  html, body { margin: 0; background: #ecebe6; }
  @media (prefers-color-scheme: dark) { html, body { background: #161615; } }
  canvas { display: block; max-width: 100%; height: auto; aspect-ratio: 1; }
</style>
<canvas id="c" width="800" height="800"></canvas>
<script type="module">
import * as THREE from "three";
import { fitBody } from "/js/human/fit.js";
import { buildRig } from "/js/human/rig.js";
import * as P from "/js/human/pose.js";
import { POSTURES, byId } from "/js/human/postures.js";
import { bodyProxies, proxyWorld, selfPenetrations } from "/js/human/proxies.js";

const params = new URLSearchParams(location.search);
const size = +params.get("size") || 800;
const canvas = document.getElementById("c");
canvas.width = size; canvas.height = size;
const dark = matchMedia("(prefers-color-scheme: dark)").matches;
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(size, size, false);
const scene = new THREE.Scene();
scene.background = new THREE.Color(dark ? 0x161615 : 0xecebe6);
scene.add(new THREE.HemisphereLight(0xffffff, dark ? 0x30302c : 0xb9b6ac, dark ? 1.1 : 1.35));
const key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(1.5, 3, 3); scene.add(key);
scene.add(new THREE.GridHelper(4, 40, dark ? 0x55554f : 0xb0aea5, dark ? 0x2a2a27 : 0xd0cec5));
const camera = new THREE.PerspectiveCamera(30, 1, 0.05, 50);

const body = fitBody({ sex: params.get("sex") || "M", measures: { stature: { value: 1000 * (+params.get("stature") || 1.75), unit: "mm" } } });
const rig = buildRig(body, { skeleton: true, quality: "low" });
scene.add(rig.group);
const overlay = new THREE.Group();
scene.add(overlay);

const COLORS = { head: 0xe07a5f, neck: 0xe07a5f, chest: 0x3d85c6, abdomen: 0x4aa3a0, pelvis: 0x6a994e, buttock: 0x6a994e, shoulders: 0x3d85c6, upper_arm: 0xf2cc8f, forearm: 0xe9b44c, palm: 0xd4a017, fingers: 0xd4a017, thigh: 0x9d6fc4, shank: 0xb48ad6, kneecap: 0xc9a7e3, foot: 0x8d6e63, toes: 0x8d6e63 };
function clearOverlay() {
  for (const o of [...overlay.children]) { overlay.remove(o); o.traverse((n) => { n.geometry?.dispose?.(); n.material?.dispose?.(); }); }
}
function capsule(w, i, prox, color) {
  const a = new THREE.Vector3(w.ax[i], w.ay[i], w.az[i]), b = new THREE.Vector3(w.bx[i], w.by[i], w.bz[i]), g = new THREE.Group();
  const mat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.28, depthWrite: false });
  for (const [p, r] of [[a, w.ra[i]], [b, w.rb[i]]]) { const s = new THREE.Mesh(new THREE.SphereGeometry(r, 14, 10), mat); s.position.copy(p); g.add(s); }
  const len = a.distanceTo(b);
  if (len > 1e-6) {
    const cyl = new THREE.Mesh(new THREE.CylinderGeometry(w.rb[i], w.ra[i], len, 14, 1, true), mat);
    cyl.position.copy(a).add(b).multiplyScalar(0.5);
    cyl.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), b.clone().sub(a).normalize());
    g.add(cyl);
  }
  return g;
}

function view({ az = 0, el = 8, dist = 5, target = [0, 0.9, 0], fov = 30 } = {}) {
  const a = (az * Math.PI) / 180, e = (el * Math.PI) / 180;
  camera.fov = fov; camera.updateProjectionMatrix();
  camera.position.set(target[0] + dist * Math.sin(a) * Math.cos(e), target[1] + dist * Math.sin(e), target[2] + dist * Math.cos(a) * Math.cos(e));
  camera.lookAt(...target);
  renderer.render(scene, camera);
}

/** posture: a Posture, or { pose: { root, angles }, support?, hints? }. */
function show(posture, o = {}) {
  const ex = posture.pose ? { root: posture.pose.root ?? {}, angles: posture.pose.angles ?? {} } : P.expandPosture(posture);
  const pose = P.clampPose(ex).pose;
  const verdict = posture.pose ? null : P.validatePosture(body, posture, { library: POSTURES });
  const support = posture.support ?? "feet";
  const placed = P.placePoseDetailed(body, pose, { support, posture });
  const root = placed.root;
  rig.setPose({ root, angles: pose.angles }, { clamp: false });
  clearOverlay();
  const kin = P.solvePose(body, pose, root);
  if (o.proxies !== false) {
    const prox = bodyProxies(body), w = proxyWorld(prox, kin);
    prox.list.forEach((c, i) => overlay.add(capsule(w, i, prox, COLORS[c.group] ?? 0xcccccc)));
  }
  // seat plane
  if (placed.surfaces.seat !== undefined && "seat" in placed.carriers) {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 0.5), new THREE.MeshBasicMaterial({ color: 0xcc6633, transparent: true, opacity: 0.35, side: THREE.DoubleSide }));
    m.rotation.x = -Math.PI / 2; m.position.set(0, placed.surfaces.seat, 0.0); overlay.add(m);
  }
  // centre of mass and support polygon
  const com = P.centerOfMass(body, pose, root, new THREE.Vector3(), posture.hints?.load).point;
  const dot = new THREE.Mesh(new THREE.SphereGeometry(0.02, 12, 8), new THREE.MeshBasicMaterial({ color: 0xff2222 }));
  dot.position.copy(com); overlay.add(dot);
  const foot = new THREE.Mesh(new THREE.SphereGeometry(0.012, 10, 6), new THREE.MeshBasicMaterial({ color: 0xff2222 }));
  foot.position.set(com.x, 0.005, com.z); overlay.add(foot);
  const pts = [];
  for (const [set, surf] of Object.entries(placed.carriers)) {
    for (const r of P.contactClearances(body, pose, root, placed.surfaces, { [set]: surf })) {
      if (r.clearance <= 0.015 && !r.point.startsWith("proxy:")) { const v = P.landmarkPosition(body, pose, root, r.point); pts.push([v.x, v.y, v.z]); }
    }
  }
  const bal = pts.length ? P.balance(body, pose, root, pts, { load: posture.hints?.load }) : null;
  if (bal && bal.hull.length > 1) {
    const g = new THREE.BufferGeometry().setFromPoints(bal.hull.map(([x, z]) => new THREE.Vector3(x, 0.004, z)));
    overlay.add(new THREE.LineLoop(g, new THREE.LineBasicMaterial({ color: 0x0066ff })));
  }
  view({ target: [0, Math.max(0.5, com.y), 0], ...o });
  return { ok: verdict?.ok ?? null, errors: verdict?.errors ?? [], warnings: verdict?.warnings ?? [], root, gaps: placed.gaps, seat: placed.surfaces.seat ?? null, balanceMargin: bal?.margin ?? null,
    penetrations: selfPenetrations(bodyProxies(body), proxyWorld(bodyProxies(body), kin)).map((p) => `${p.a}/${p.b} ${Math.round(p.depth * 1000)}`) };
}
function library(id, o) { const p = byId(id); if (!p) throw new Error(`no posture ${id}`); return show(p, o); }

window.__demo = { body, rig, show, library, view };
show({ id: "neutral", support: "feet" });
window.__ready = true;
</script>
