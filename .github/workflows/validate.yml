name: validate

on:
  push:
  pull_request:

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Catalog is valid and generated files are up to date
        run: python scripts/build_catalog.py --check
      - name: Committed datasets match SHA256SUMS
        run: python scripts/fetch.py verify
