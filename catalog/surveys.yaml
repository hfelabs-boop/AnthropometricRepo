# Military anthropometric surveys: source catalog (September 2026 update)
#
# One entry per survey (49 entries). This file is the source of truth;
# catalog/surveys.csv, catalog/surveys.json and CATALOG.md are generated from
# it by `python scripts/build_catalog.py`.
#
# Field guide
#   id            short stable slug
#   row           row number in the original research table
#   country / service / sexes / year_start / n_total   structured facets
#                 for filtering (year_start = first year of measuring; n_total = subjects)
#   region        United States | United Kingdom | Canada / Australia / New Zealand |
#                 Europe / Other | Asia-Pacific / Middle East / Latin America
#   citations     full bibliographic citations
#   reports       study PDFs / landing pages  {label, url}
#   data          individual-level data sources {label, url, local}
#                 `local` is the path of the copy committed in this repo
#   data_access   public | not public | commercial | restricted | n/a
#   report_access free | paywalled | restricted | not found | ...
#   licence       licence or copyright status, if known
#   measured / published / sample / dimensions   corrected facts
#   verification  verified | partly verified | not verified
#   notes         corrections and caveats

surveys:

